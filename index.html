<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel de Lavado de Manos</title>
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel lavado">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#F2F5F7;--surface:#FFFFFF;--ink:#13222D;--muted:#5A6B76;--line:#D7E0E5;--accent:#1F4E79;--accent-ink:#FFFFFF;
  --ok:#1C7F47;--ok-bg:#E2F3E9;--warn:#9A6212;--warn-bg:#FCEFD3;--bad:#B4322A;--bad-bg:#FADFDB;--off-bg:#E9EEF1;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-num:"Atkinson Hyperlegible Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D151B;--surface:#15212A;--ink:#E4EDF1;--muted:#93A4AE;--line:#26343E;--accent:#82B6E8;--accent-ink:#0D151B;
  --ok:#5CC98D;--ok-bg:#11301F;--warn:#F2B755;--warn-bg:#33270E;--bad:#F27D71;--bad-bg:#3B1A16;--off-bg:#1B2832;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 0 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{font:800 clamp(1.2rem,3.5vw,1.55rem)/1.1 var(--f-display);margin:0;text-wrap:balance}
h1 small{display:block;font:400 .8rem var(--f-body);color:var(--muted)}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%}
nav button{border:0;background:none;color:var(--muted);font:700 .92rem var(--f-body);padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font:600 1.15rem var(--f-display);margin:22px 0 10px}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.banner{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.sum{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:700 1.8rem/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.stat.ok,.stat.warn,.stat.bad{background:var(--surface)}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:160px}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:700 .78rem var(--f-body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.off{background:var(--off-bg);color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.dot.smoke{background:var(--muted)}.smoke{background:var(--off-bg);color:var(--ink)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:700 1rem var(--f-body);padding:11px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 12px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:default}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
input,select{font:1rem var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=number]{width:96px}
.overlay{position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal h3{font:800 1.35rem/1.15 var(--f-display);margin:0;overflow-wrap:anywhere}
.modal .acts{display:flex;flex-direction:column;gap:8px}
.cred{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.cred b{font:700 1.7rem var(--f-num);letter-spacing:.12em;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.loginbox{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.err{color:var(--bad);font-weight:700;margin:0;min-height:1.4em}
.search{width:100%;max-width:320px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="loginbox" hidden>
    <div style="display:flex;align-items:center;gap:12px"><img src="icon-192.png" alt="" style="width:52px;height:52px;border-radius:14px"><h1>Panel de lavado de manos<small>Nutricionistas y encargados</small></h1></div>
    <form class="card form" id="loginf" style="flex-direction:column;align-items:stretch" novalidate>
      <div class="field"><label class="lbl" for="em">Mail</label><input id="em" type="email" autocomplete="username"></div>
      <div class="field"><label class="lbl" for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn" type="submit" id="lbtn">Ingresar</button>
    </form>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Lavado de manos<small id="clock">Servicio de cocina</small></h1>
      <nav aria-label="Vistas">
        <button data-v="ahora">Ahora</button>
        <button data-v="registro">Registro</button>
        <button data-v="personal">Personal</button>
        <button data-v="ajustes">Ajustes</button>
      </nav>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="view"></main>
  </section>
</div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../config.js"></script>
<script>
const L = window.LAVADO;
const sb = supabase.createClient(L.url, L.anon, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'lavado-panel' } });
const S = { sinks: [], staff: [], washes: [], cfg: { cocina: 90, general: 120, aviso: 15, max_turno_h: 10 }, subs: {}, sups: [], view: 'ahora', day: dayKey(new Date()), q: '', chan: null, sound: false, voice: false, prevWarn: new Set(), prevBad: new Set(), lastRed: 0 };
const GN = { cocina: 'Cocina', general: 'Resto del personal' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const hm = t => new Date(t).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function dur(min){ min = Math.max(0, Math.round(min)); const h = Math.floor(min/60), m = min%60; return h ? h+' h '+String(m).padStart(2,'0') : m+' min'; }
const ivOf = p => p.grp === 'cocina' ? S.cfg.cocina : S.cfg.general;
function status(p, now = Date.now()){
  if (p.smoke_at) { const iv = S.cfg.smoke_min || 15, left = iv - (now - Date.parse(p.smoke_at)) / 60000; return { st: left <= 0 ? 'bad' : 'smoke', left, iv, smoke: true }; }
  const iv = ivOf(p), el = (now - Date.parse(p.last_wash || now)) / 60000, left = iv - el;
  return { st: left <= 0 ? 'bad' : left <= S.cfg.aviso ? 'warn' : 'ok', left, iv };
}
const active = () => S.staff.filter(p => p.active);
const rank = { bad: 0, warn: 1, smoke: 2, ok: 3 };
const onShift = () => active().filter(p => p.on_shift).map(p => ({ p, s: status(p) })).sort((a, b) => rank[a.s.st] - rank[b.s.st] || a.s.left - b.s.left);
const byId = id => S.staff.find(p => p.id === id);
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); }
function banner(m){ const b = $('#banner'); b.textContent = m || ''; b.hidden = !m; }
function show(id){ ['login','app'].forEach(x => $('#'+x).hidden = x !== id); }

/* ---------- Ingreso ---------- */
$('#loginf').addEventListener('submit', async e => {
  e.preventDefault();
  const em = $('#em').value.trim(), pw = $('#pw').value, err = $('#lerr');
  if (!em || !pw) { err.textContent = 'Completá mail y contraseña.'; return; }
  $('#lbtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: em, password: pw });
  $('#lbtn').disabled = false;
  if (error) { err.textContent = 'Mail o contraseña incorrectos.'; return; }
  start();
});
async function start(){
  const { data: ok } = await sb.rpc('is_supervisor');
  if (!ok) { await sb.auth.signOut(); show('login'); $('#lerr').textContent = 'Esta cuenta no es de encargado.'; return; }
  show('app'); setView((location.hash || '').slice(1) || 'ahora');
  await Promise.all([loadStaff(), loadCfg(), loadWashes(), loadSubs(), loadSinks()]);
  render(); live();
}

/* ---------- Datos ---------- */
async function loadStaff(){ const { data, error } = await sb.from('staff').select('*').order('name'); if (error) return banner('No se pudo leer el personal. Revisá la conexión.'); S.staff = data; banner(''); checkAlarms(); }
async function loadSinks(){ const { data } = await sb.from('sinks').select('*').order('created_at'); S.sinks = data || []; }
async function loadCfg(){ const { data } = await sb.from('config').select('*').single(); if (data) S.cfg = data; }
async function loadSubs(){ const { data } = await sb.rpc('sub_counts'); S.subs = {}; (data || []).forEach(r => S.subs[r.staff_id] = r.n); }
async function loadWashes(){
  const [y, m, d] = S.day.split('-').map(Number), a = new Date(y, m-1, d), b = new Date(y, m-1, d+1);
  const { data } = await sb.from('washes').select('*').gte('t', a.toISOString()).lt('t', b.toISOString()).order('t', { ascending: false });
  S.washes = data || [];
}
function live(){
  if (S.chan) return;
  S.chan = sb.channel('panel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'staff' }, () => loadStaff().then(soft))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'washes' }, () => loadWashes().then(soft))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'config' }, () => loadCfg().then(soft))
    .subscribe();
}
const busyInput = () => { const a = document.activeElement; return a && ['INPUT','SELECT'].includes(a.tagName); };
const soft = () => { if ($('#modal').hidden && !busyInput()) render(); };
setInterval(() => { checkAlarms(); soft(); }, 15000);
setInterval(() => { if (!document.hidden && !$('#app').hidden) { loadStaff(); loadSubs(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').hidden) Promise.all([loadStaff(), loadWashes(), loadSubs()]).then(soft); });

/* ---------- Vistas ---------- */
function setView(v){ if (!['ahora','registro','personal','ajustes'].includes(v)) v = 'ahora'; S.view = v;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'));
  try { history.replaceState(null, '', '#'+v); } catch(e){}
  render(); if (v === 'ajustes') loadSups(); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setView(b.dataset.v));

function render(){
  $('#clock').textContent = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }) + ' · ' + hm(Date.now());
  const v = $('#view');
  v.innerHTML = S.view === 'ahora' ? vAhora() : S.view === 'registro' ? vRegistro() : S.view === 'personal' ? vPersonal() : vAjustes();
  bind();
}

function vAhora(){
  const on = onShift(), c = { ok: 0, warn: 0, bad: 0, smoke: 0 }; on.forEach(x => c[x.s.st]++);
  const today = S.day === dayKey(new Date()), reg = today ? S.washes.filter(w => w.kind === 'lavado') : [], late = reg.filter(w => w.late_min > 0);
  const pct = reg.length ? Math.round((reg.length - late.length) / reg.length * 100) : null;
  const off = active().filter(p => !p.on_shift).sort((a, b) => a.name.localeCompare(b.name, 'es'));
  let h = `<h2>En este momento</h2><div class="sum">
    <div class="stat ok"><span class="lbl">Al día</span><b>${c.ok}</b></div>
    <div class="stat warn"><span class="lbl">Por vencer</span><b>${c.warn}</b></div>
    <div class="stat bad"><span class="lbl">Vencidos</span><b>${c.bad}</b></div>
    <div class="stat"><span class="lbl">Puntualidad hoy</span><b>${pct === null ? '—' : pct + '%'}</b></div></div>${c.smoke ? `<p class="muted" style="margin:10px 0 0">🚬 ${c.smoke} ${c.smoke === 1 ? 'persona en pausa' : 'personas en pausa'} para fumar</p>` : ''}`;
  h += `<h2>En turno (${on.length})</h2>`;
  h += on.length ? `<div class="list">${on.map(({ p, s }) => `<div class="row"><i class="dot ${s.st}"></i>
      <div class="grow"><div class="nm">${esc(p.name)}</div><div class="muted" style="font-size:.85rem">${GN[p.grp]} · último lavado ${hm(p.last_wash)}${S.subs[p.id] ? '' : ' · <span style="color:var(--bad)">sin avisos</span>'}</div></div>
      <span class="pill ${s.st} num">${s.st === 'bad' ? (s.smoke ? 'pausa vencida hace ' : 'vencido hace ') + dur(-s.left) : s.smoke ? '🚬 fumando · vuelve ' + hm(Date.parse(p.smoke_at) + s.iv * 60000) : 'faltan ' + dur(s.left)}</span>
      <div class="acts"><button class="btn ghost sm" data-wash="${p.id}">Marcar lavado</button><button class="btn ghost sm" data-out="${p.id}">Salida</button></div></div>`).join('')}</div>
      <div class="legend"><span><i class="dot ok"></i>Al día</span><span><i class="dot warn"></i>Faltan ${S.cfg.aviso} min o menos</span><span><i class="dot bad"></i>Vencido</span><span><i class="dot smoke"></i>En pausa para fumar</span></div>`
    : `<div class="empty">Nadie en turno. Cada persona inicia su turno desde la app en su celular.</div>`;
  h += `<h2>Fuera de turno</h2><p class="muted" style="margin-top:-4px">Para quien no tiene celular: iniciá el turno desde acá y marcá sus lavados en la lista de arriba.</p>`;
  h += off.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">${off.map(p => `<button class="btn ghost sm" data-start="${p.id}">${esc(p.name)}</button>`).join('')}</div>` : `<p class="muted">Todo el personal está en turno.</p>`;
  h += soundBar();
  return h;
}

function vRegistro(){
  const ws = S.washes;
  let h = `<div class="form" style="justify-content:space-between;margin-top:18px"><h2 style="margin:0">Registro del día</h2>
    <div class="form"><div class="field"><label class="lbl" for="day">Fecha</label><input type="date" id="day" value="${S.day}"></div>
    <button class="btn ghost sm" id="csv"${ws.length ? '' : ' disabled'}>Descargar CSV</button></div></div>`;
  if (!ws.length) return h + `<div class="empty" style="margin-top:14px">Sin registros para esta fecha.</div>`;
  const per = {};
  ws.forEach(w => { const k = w.staff_id; per[k] = per[k] || { name: w.name, n: 0, late: 0, maxLate: 0 }; if (w.kind === 'lavado') { per[k].n++; if (w.late_min > 0) { per[k].late++; per[k].maxLate = Math.max(per[k].maxLate, w.late_min); } } });
  const pr = Object.values(per).sort((a, b) => b.late - a.late || a.name.localeCompare(b.name, 'es'));
  h += `<h2>Resumen por persona</h2><div class="list tbl"><table><thead><tr><th>Persona</th><th>Lavados</th><th>Tarde</th><th>Mayor retraso</th></tr></thead><tbody>
    ${pr.map(r => `<tr><td>${esc(r.name)}</td><td>${r.n}</td><td style="color:${r.late ? 'var(--bad)' : 'inherit'}">${r.late}</td><td>${r.maxLate ? dur(r.maxLate) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
  h += `<h2>Detalle</h2><div class="list tbl"><table><thead><tr><th>Hora</th><th>Persona</th><th>Estado</th></tr></thead><tbody>
    ${ws.map(w => `<tr><td class="num">${hm(w.t)}</td><td>${esc(w.name)}${w.by_supervisor ? ' <span class="muted">(encargado)</span>' : ''}${w.sink_id && sinkName(w.sink_id) ? ' <span class="muted">· ' + esc(sinkName(w.sink_id)) + '</span>' : ''}</td><td>${kindPill(w)}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}
function kindPill(w){ if (w.kind === 'fumar') return '<span class="pill off">🚬 Salió a fumar</span>'; return w.kind === 'ingreso' ? '<span class="pill off">Ingreso</span>' : w.kind === 'salida' ? '<span class="pill off">Salida</span>' : w.kind === 'salida_auto' ? '<span class="pill off">Salida automática</span>' : w.late_min > 0 ? `<span class="pill bad">Tarde ${dur(w.late_min)}</span>` : '<span class="pill ok">A tiempo</span>'; }

function vPersonal(){
  const q = S.q.toLowerCase();
  const list = active().filter(p => !q || p.name.toLowerCase().includes(q) || p.code.includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'es'));
  const noAcc = active().filter(p => !p.auth_user).length;
  let h = `<h2>Agregar persona</h2><form class="form" id="addf">
    <div class="field" style="flex:1;min-width:200px"><label class="lbl" for="nm">Apellido y nombre</label><input id="nm" maxlength="60" placeholder="Ej.: PEREZ, LAURA"></div>
    <div class="field"><label class="lbl" for="gr">Sector</label><select id="gr"><option value="cocina">Cocina</option><option value="general">Resto del personal</option></select></div>
    <button class="btn" type="submit">Agregar</button></form><p class="err" id="adderr"></p>`;
  h += `<div class="form" style="justify-content:space-between"><h2 style="margin:0">Personal (${active().length})</h2><input class="search" id="q" placeholder="Buscar por nombre o código" value="${esc(S.q)}"></div>`;
  if (noAcc) h += `<p class="muted">${noAcc} ${noAcc === 1 ? 'persona todavía no tiene' : 'personas todavía no tienen'} PIN. Tocá "Dar PIN" para crear su acceso a la app.</p>`;
  h += list.length ? `<div class="list">${list.map(p => `<div class="row"><div class="grow"><div class="nm">${esc(p.name)}</div>
      <div class="muted num" style="font-size:.85rem">Código ${p.code} · ${p.auth_user ? (S.subs[p.id] ? '<span style="color:var(--ok)">app con avisos</span>' : 'tiene PIN, sin avisos activados') : '<span style="color:var(--warn)">sin PIN</span>'}</div></div>

const sinkName = id => (S.sinks.find(k => k.id === id) || {}).name || '';
function sinkPdf(k){
  try {
    const q = qrcode(0, 'M'); q.addData('LAVADO-BACHA:' + k.token); q.make();
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' }), n = q.getModuleCount(), sz = 120, c = sz / n, x0 = (210 - sz) / 2, y0 = 70;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(30); doc.setTextColor(19, 34, 45); doc.text('LAVADO DE MANOS', 105, 32, { align: 'center' });
    doc.setFontSize(16); doc.setTextColor(31, 78, 121); doc.text(k.name, 105, 44, { align: 'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(90, 107, 118);
    doc.text('Escaneá este código al empezar y otra vez al terminar de lavarte.', 105, 58, { align: 'center' });
    doc.setFillColor(0, 0, 0); for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) doc.rect(x0 + cc * c, y0 + r * c, c + .02, c + .02, 'F');
    doc.setFontSize(14); doc.setTextColor(19, 34, 45);
    ['1. Mojate las manos y poné jabón', '2. Frotá palmas, dorso, entre los dedos, pulgares y uñas', '3. Enjuagá y secate con papel descartable'].forEach((t, i) => doc.text(t, 105, y0 + sz + 18 + i * 9, { align: 'center' }));
    doc.setFontSize(10); doc.setTextColor(140, 150, 158); doc.text('Si este QR se daña o alguien lo fotografía, el encargado puede cambiarlo desde el panel.', 105, 282, { align: 'center' });
    doc.save('QR-' + k.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.pdf');
  } catch (e) { toast('No se pudo generar el PDF. Recargá la página y probá de nuevo.'); }
}

    } catch(e) { $('#pinerr').textContent = e.message; $('#go').disabled = false; $('#go').textContent = 'Guardar PIN'; } };
}

/* ---------- Sonido ---------- */
let actx;
function tone(f, st, len, type){ const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + st; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + len); o.start(t); o.stop(t + len + .05); }
function beep(kind){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); if (kind === 'bad') [0, .32, .64].forEach(s => tone(988, s, .24, 'square')); else { tone(660, 0, .3, 'sine'); tone(880, .38, .4, 'sine'); } } catch(e){} }
function checkAlarms(){ const on = onShift(), warn = new Set(on.filter(x => x.s.st === 'warn').map(x => x.p.id)), bad = new Set(on.filter(x => x.s.st === 'bad').map(x => x.p.id));
  if (S.sound || S.voice) { const nb = [...bad].filter(id => !S.prevBad.has(id)), nw = [...warn].filter(id => !S.prevWarn.has(id)), t = Date.now();
    const name = id => fullName((byId(id) || {}).name);
    if (nb.length || (bad.size && t - S.lastRed > 300000)) { if (S.sound) beep('bad'); S.lastRed = t;
      if (S.voice) { const ids = nb.length ? nb : [...bad]; setTimeout(() => ids.forEach(id => speak(name(id) + ', estás en rojo')), S.sound ? 900 : 0); } }
    if (nw.length) { if (S.sound && !nb.length) beep('warn');
      if (S.voice) setTimeout(() => nw.forEach(id => speak(name(id) + ', estás en amarillo')), S.sound ? 700 : 0); } }
  S.prevWarn = warn; S.prevBad = bad; }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => { const { data: { session } } = await sb.auth.getSession(); if (session) start(); else show('login'); })();
